version: '3.8'

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mongodb_tenders
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: tunip
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - tenders_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/tunip --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Node.js + Scrapers Python
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_tenders
    restart: unless-stopped
    ports:
      - "5000:5000"  # API principale Node.js
      - "5003:5003"  # BOAMP scraper
      - "5001:5001"  # TUNEPS scraper
      - "5005:5005"  # TUNEPS AO scraper
      - "5006:5006"  # PNUD scraper
      - "5007:5007"  # ARMP scraper
      - "5010:5010"  # BANQUE MONDIALE scraper
      - "5011:5011"  # HAICOP scraper
      - "5012:5012"  # BENIN scraper
      - "5013:5013"  # EXPERTISE FRANCE scraper
      - "5014:5014"  # GIZ scraper
      - "5015:5015"  # RELIEF scraper
      - "5016:5016"  # MEDIACONGO scraper
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/marmoucha
      - DB_NAME=marmoucha
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_change_me}
      - API_BASE_URL=https://be.appeloffres.net/api
      - API_EMAIL=mariem.bousalem@tunipages.tn
      - API_PASSWORD=L96BhA6ODugl
      - DEFAULT_SOURCE_ID=817
      - DEFAULT_PROMOTER_ID=223472
      - DEFAULT_AVIS_ID=2
      - DEFAULT_PAYS_ID=219
      - DEFAULT_CURRENCY_ID=111
      - BOAMP_COLLECTION_NAME=boampvalidates
      - BOAMP_PENDING_COLLECTION_NAME=boampoffres
      - PNUD_COLLECTION_NAME=tenders_pnud
      - PNUD_PENDING_COLLECTION_NAME=pending_tenders_pnud
    volumes:
      - ./backend/output:/app/output
      - ./backend/excelpnud:/app/excelpnud
      - ./backend/screenshots:/app/screenshots
      - ./backend/logs:/app/logs
      - ./backend/scripts/pdf_tuneps_extraction:/app/scripts/pdf_tuneps_extraction
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tenders_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: ./auth-frontend
      dockerfile: Dockerfile
    container_name: frontend_tenders
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
    networks:
      - tenders_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumes persistants
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

# Réseau interne
networks:
  tenders_network:
    driver: bridge
