version: '3.8'

services:
  # Base de données PostgreSQL (pour Benin, MediaCongo, Relief)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_tenders
    restart: "no"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tender_user
      POSTGRES_PASSWORD: tender_password_2024
      POSTGRES_DB: tenders_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tenders_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tender_user -d tenders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Node.js + Scrapers Python
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_tenders
    restart: "no"
    ports:
      - "5000:5000"  # API principale Node.js
      - "5003:5003"  # BOAMP scraper
      - "5001:5001"  # TUNEPS scraper
      - "5005:5005"  # TUNEPS AO scraper
      - "5006:5006"  # PNUD scraper
      - "5007:5007"  # ARMP scraper
      - "5010:5010"  # BANQUE MONDIALE scraper
      - "5011:5011"  # HAICOP scraper
      - "5012:5012"  # BENIN scraper
      - "5013:5013"  # EXPERTISE FRANCE scraper
      - "5014:5014"  # GIZ scraper
      - "5015:5015"  # RELIEF scraper
      - "5016:5016"  # MEDIACONGO scraper
      - "5017:5017"  # PPDA scraper
      - "5018:5018"  # NIGER scraper
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://tender_user:tender_password_2024@postgres:5432/tenders_db
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tenders_db
      - DB_USER=tender_user
      - DB_PASSWORD=tender_password_2024
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_change_me}
      - API_BASE_URL=https://be.appeloffres.net/api
      - API_EMAIL=mariem.bousalem@tunipages.tn
      - API_PASSWORD=L96BhA6ODugl
      - DEFAULT_SOURCE_ID=817
      - DEFAULT_PROMOTER_ID=223472
      - DEFAULT_AVIS_ID=2
      - DEFAULT_PAYS_ID=219
      - DEFAULT_CURRENCY_ID=111
      - BOAMP_COLLECTION_NAME=boampvalidates
      - BOAMP_PENDING_COLLECTION_NAME=boampoffres
      - PNUD_COLLECTION_NAME=tenders_pnud
      - PNUD_PENDING_COLLECTION_NAME=pending_tenders_pnud
    volumes:
      - ./backend/output:/app/output
      - ./backend/excelpnud:/app/excelpnud
      - ./backend/screenshots:/app/screenshots
      - ./backend/logs:/app/logs
      - ./backend/scripts/pdf_tuneps_extraction:/app/scripts/pdf_tuneps_extraction
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenders_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: ./auth-frontend
      dockerfile: Dockerfile
    container_name: frontend_tenders
    restart: "no"
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
    networks:
      - tenders_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin - PostgreSQL Database visualization tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_tenders
    restart: "no"
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tenders_network

# Volumes persistants
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# Réseau interne
networks:
  tenders_network:
    driver: bridge
